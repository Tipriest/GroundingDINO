model:
  config_path: groundingdino/config/GroundingDINO_SwinB_cfg.py
  weights_path: weights/groundingdino_swinb_cogcoor.pth
  device: cuda

inference:
  box_threshold: 0.35
  text_threshold: 0.25
  class_names:
    - grassland
    - road
    - rivers

data:
  image_dir: /data/self_make/water_world2026-04-04_19-25-25/p02_Frames/rgb
  output_dir: /data/self_make/water_world2026-04-04_19-25-25/p03_Grounding-DINO-First-Detection-Dataset
  recursive: false
  extensions: ["jpg", "jpeg", "png", "bmp"]
  copy_images: true
  use_symlinks: false
  skip_existing: true
  val_ratio: 0.2
  test_ratio: 0.1
  split_seed: 42
  save_visualizations: true
  vis_dir: visualizations

yolo:
  dataset_yaml: dataset.yaml
