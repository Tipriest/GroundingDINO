model:
  config_path: groundingdino/config/GroundingDINO_SwinB_cfg.py
  weights_path: weights/groundingdino_swinb_cogcoor.pth
  device: cuda

inference:
  box_threshold: 0.35
  text_threshold: 0.25
  class_names:
    - rock

data:
  image_dir: /home/tipriest/Documents/MasterDegree/auto_yolo_label_ws/src/auto_yolo_label/video_frame_extractor/frames/rgb
  output_dir: /home/tipriest/Documents/MasterDegree/auto_yolo_label_ws/src/auto_yolo_label/video_frame_extractor/frames/rgb_groundingdino_label_result
  recursive: false
  extensions: ["jpg", "jpeg", "png", "bmp"]
  copy_images: true
  use_symlinks: false
  skip_existing: true
  split_ratio: 0.2
  split_seed: 42
  save_visualizations: true
  vis_dir: visualizations

yolo:
  dataset_yaml: dataset.yaml
