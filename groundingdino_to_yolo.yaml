model:
  config_path: groundingdino/config/GroundingDINO_SwinB_cfg.py
  weights_path: weights/groundingdino_swinb_cogcoor.pth
  device: cuda

inference:
  box_threshold: 0.35
  text_threshold: 0.25
  class_names:
    - wooden walkway
    - asphalt road
    - concrete pavement
    # - grassy mixed soil area
    - forest ground
    # - forest
    # - dirt ground
    # - brown wodden road
    # - people
    # - soil and grass
    # - gray concrete road
    # - Dark red concrete road

data:
  image_dir: /data/self_make/realdog_05052026-05-05_20-17-14/p02_Frames/rgb_2026-05-05_20-19-53
  output_dir: /data/self_make/realdog_05052026-05-05_20-17-14/p03_Grounding-DINO-First-Detection-Dataset
  recursive: false
  extensions: ["jpg", "jpeg", "png", "bmp"]
  copy_images: true
  use_symlinks: false
  skip_existing: true
  val_ratio: 0.2
  test_ratio: 0.1
  split_seed: 42
  save_visualizations: true
  vis_dir: visualizations

yolo:
  dataset_yaml: dataset.yaml
